<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecom OG Image Generator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1200x630 Canvas */
        .og-canvas {
            width: 1200px;
            height: 630px;
            /* Nice slate/indigo gradient for Ecom */
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* Decorative Background */
        .grid-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .content {
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 50px 70px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 20px;
        }

        .title {
            color: white;
            font-size: 46px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: #93c5fd;
            font-size: 26px;
            font-weight: 500;
            margin: 8px 0 0 0;
        }

        .mockup-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; 
            flex: 1;
            margin-top: 10px;
        }

        /* Clean styling for images without thick borders */
        .mobile-frame {
            width: 30%; 
            max-width: 320px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            background: white; 
            transition: all 0.3s ease;
        }
        
        /* Make the center catalog image bigger */
        .mobile-large {
            transform: scale(1.15);
            z-index: 5;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="og-canvas" id="canvas">
        <div class="grid-pattern"></div>
        
        <div class="content">
            <div class="header">
                <h1 class="title">Ecom by Shyam Software</h1>
                <p class="subtitle">B2B Customer Portal â€¢ Live Ledger â€¢ Online Catalog</p>
            </div>

            <div class="mockup-container">
                <!-- Image 1 (Left) -->
                <img src="images/ecom_1.png" class="mobile-frame" alt="Ecom Screen 1" onerror="this.src='images/ecom_1.jpg'">
                
                <!-- Image 2 (Center - Larger) -->
                <img src="images/ecom_2.png" class="mobile-frame mobile-large" alt="Ecom Screen 2" onerror="this.src='images/ecom_2.jpg'">
                
                <!-- Image 3 (Right) -->
                <img src="images/ecom_3.jpeg" class="mobile-frame" alt="Ecom Screen 3" onerror="this.src='images/ecom_3.jpg'">
            </div>
        </div>
    </div>

</body>
</html>
